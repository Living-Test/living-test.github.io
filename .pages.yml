media:
  input: projects/media   # Where images/uploaded HTML files are saved in GitHub
  output: /projects/media # The URL path used on the live website

content:
  - name: projects
    label: Projects
    type: collection
    path: projects        # The GitHub folder where the project data is saved
    filename: "{primary}.json"
    fields:
      - name: title
        label: Project Title
        type: string
        required: true
      - name: author
        label: Author
        type: string
        required: true
      - name: description
        label: Description
        type: text
      - name: thumbnail
        label: Thumbnail Image
        type: image
      - name: live_link
        label: Live Demo Link (If pasting a Lovable/Vercel URL)
        type: string
      - name: student_file
        label: Upload Student HTML File (If dragging in a Claude export)
        type: file

  - name: team
    label: Team
    type: file
    path: team.json
    format: json
    list: true
    view:
      primary: name
      fields: [name, role]
    fields:
      - name: name
        label: Name
        type: string
        required: true
      - name: role
        label: Role
        type: select
        required: true
        options:
          values: [Faculty, "PhD Student", "MSEd Student"]
      - name: focus
        label: Focus
        type: string
      - name: photo
        label: Photo
        type: image
      - name: link
        label: Link
        type: string
        hint: Optional site or email. This does not create a profile page.