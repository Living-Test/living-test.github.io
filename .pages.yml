media:
  input: projects/media   # Where uploaded images are saved in GitHub
  output: /projects/media # The URL path used on the live website

content:
  - name: projects
    label: Projects
    type: collection
    path: projects        # The GitHub folder where the project data is saved
    filename: "{primary}.json"
    fields:
      - name: title
        label: Project Title
        type: string
        required: true
      - name: author
        label: Author
        type: string
        required: true
      - name: description
        label: Description
        type: text
      - name: thumbnail
        label: Thumbnail Image
        type: image
      - name: live_link
        label: Live site
        type: string
        required: true
        pattern: "^https?://.+"
        hint: The published address of this project, such as a Lovable or Vercel link.

  - name: team
    label: Team
    type: file
    path: team.json
    format: json
    list: true
    view:
      primary: name
      fields: [name, role]
    fields:
      - name: name
        label: Name
        type: string
        required: true
      - name: role
        label: Role
        type: select
        required: true
        options:
          values: [Faculty, "PhD Student", "MSEd Student"]
      - name: focus
        label: Focus
        type: string
      - name: photo
        label: Photo
        type: image
      - name: link
        label: Link
        type: string
        hint: Optional site or email. This does not create a profile page.

  - name: events
    label: Events
    type: file
    path: events.json
    format: json
    list: true
    view:
      primary: title
      fields: [title, date]
    fields:
      - name: title
        label: Title
        type: string
        required: true
      - name: date
        label: Date
        type: date
        required: true
      - name: location
        label: Location
        type: string
      - name: summary
        label: Summary
        type: text
      - name: sample
        label: Sample placeholder
        type: boolean
        hint: Turn this on while the event is stand-in copy. The site shows a Sample label.