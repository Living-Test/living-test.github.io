media:
  input: projects/media   # Where uploaded images are saved in GitHub
  output: /projects/media # The URL path used on the live website

content:
  - name: projects
    label: Projects
    type: collection
    path: projects        # The GitHub folder where the project data is saved
    filename: "{primary}.json"
    view:
      primary: title
      fields: [title, author, project_type]
    fields:
      - name: title
        label: Project Title
        type: string
        required: true
      - name: author
        label: Team Authors
        type: reference
        required: false
        options:
          collection: team
          multiple: true
          value: "{fields.name}"
          label: "{fields.name}"
          search: [fields.name]          
      - name: guest_authors
        label: Guest Authors
        type: string
        list: true
        description: Manually type names of authors not in the Team collection.
      - name: description
        label: Description
        type: text
      - name: thumbnail
        label: Thumbnail Image
        type: image
      - name: project_type
        label: Project type
        type: select
        description: Choose Deployed app for a site that is already online, or HTML file for a page uploaded here. The website opens whichever one you choose in a new tab.
        options:
          values:
            - name: app
              label: Deployed app
            - name: html
              label: HTML file
      - name: live_link
        label: Deployed app address
        type: string
        description: Fill this in for a deployed app. Leave it blank for an HTML file.
        pattern:
          regex: "^$|^https?://.+"
          message: Enter a full address starting with http:// or https://, or leave this blank for an HTML file.
      - name: html_file
        label: HTML file
        type: file
        description: Upload an HTML file for this project. Used when the project type is HTML file.
        options:
          extensions: [html, htm]
          rename: safe

  - name: team
    label: Team
    type: file
    path: team.json
    format: json
    list: true
    view:
      primary: name
      fields: [name, role, focus]
    fields:
      - name: name
        label: Name
        type: string
        required: true
      - name: role
        label: Role
        type: select
        required: true
        options:
          values: ["Leadership Team", "Affiliated Members", "PhD Student", "MSEd Student"]
      - name: focused_role
        label: Focus
        type: string
      - name: photo
        label: Photo
        type: image
      - name: link
        label: Link
        type: string
        hint: Optional site or email. This does not create a profile page.

  - name: events
    label: Events
    type: file
    path: events.json
    format: json
    list: true
    view:
      primary: title
      fields: [title, date]
    fields:
      - name: title
        label: Title
        type: string
        required: true
      - name: date
        label: Date
        type: date
        required: true
      - name: location
        label: Location
        type: string
      - name: summary
        label: Summary
        type: text
      - name: sample
        label: Sample placeholder
        type: boolean
        hint: Turn this on while the event is stand-in copy. The site shows a Sample label.