media:
  folder: projects
  public: /projects

content:
  - name: projects
    label: Projects
    type: collection
    folder: projects
    extension: json
    format: json
    fields:
      - name: title
        label: Project Title
        type: string
        required: true
      - name: author
        label: Author
        type: string
        required: true
      - name: description
        label: Description
        type: text
        required: false
      - name: thumbnail
        label: Thumbnail Image
        type: image
        required: false
      - name: live_link
        label: Live Demo Link (If pasting a Lovable/Vercel URL)
        type: string
        required: false
      - name: student_file
        label: Upload Student HTML File (If dragging in a Claude export)
        type: file
        required: false
