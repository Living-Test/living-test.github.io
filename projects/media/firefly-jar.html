<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Firefly Jar</title>
<style>
:root{--bg:#eef0fa;--cell:#d3d9f0;--cell-hi:#c2caea;--fly:#d9a800;--glow:rgba(217,168,0,.45);--text:#1d2347;--muted:#5b6391;--miss:#d94a5e;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light dark}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#171c38;--cell:#242d57;--cell-hi:#2e3866;--fly:#eef56b;--glow:rgba(238,245,107,.55);--text:#e9ecf7;--muted:#98a0cc;--miss:#ff7a8a}}
:root[data-theme="dark"]{--bg:#171c38;--cell:#242d57;--cell-hi:#2e3866;--fly:#eef56b;--glow:rgba(238,245,107,.55);--text:#e9ecf7;--muted:#98a0cc;--miss:#ff7a8a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--text);font-family:Georgia,"Times New Roman",serif;min-height:100vh;display:flex;justify-content:center}
main{width:100%;max-width:420px;padding:28px 20px 40px}
h1{font-size:2rem;margin:0 0 4px;font-weight:700;letter-spacing:-.01em}
p.sub{margin:0 0 20px;color:var(--muted);line-height:1.5}
.stats{display:flex;justify-content:space-between;gap:12px;margin-bottom:16px;font-size:1.1rem}
.stats b{font-size:1.6rem;font-variant-numeric:tabular-nums}
.stats span{display:block;color:var(--muted);font-size:.85rem}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.cell{aspect-ratio:1;border:0;border-radius:18px;background:var(--cell);cursor:pointer;position:relative;padding:0;transition:background .12s}
.cell:hover{background:var(--cell-hi)}
.cell:focus-visible{outline:3px solid var(--fly);outline-offset:2px}
.cell.miss{background:var(--miss)}
.fly{position:absolute;inset:34%;border-radius:50%;background:var(--fly);box-shadow:0 0 28px 14px var(--glow);animation:pulse .7s ease-in-out infinite alternate}
@keyframes pulse{to{transform:scale(1.25)}}
@media (prefers-reduced-motion:reduce){.fly{animation:none}}
.bar{margin-top:20px;display:flex;align-items:center;gap:14px}
button.go{font:inherit;font-size:1.05rem;padding:12px 22px;border-radius:999px;border:0;background:var(--fly);color:#171c38;cursor:pointer;font-weight:700}
button.go:focus-visible{outline:3px solid var(--text);outline-offset:2px}
.msg{color:var(--muted);line-height:1.4}
</style>
</head>
<body>
<main><div id="root"></div></main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script>
const { useState, useEffect, useRef, useCallback } = React;
const h = React.createElement;
const KEY = "firefly-jar-best";

function App() {
  const [phase, setPhase] = useState("idle");
  const [score, setScore] = useState(0);
  const [time, setTime] = useState(30);
  const [active, setActive] = useState(-1);
  const [miss, setMiss] = useState(-1);
  const [best, setBest] = useState(() => {
    try { return Number(localStorage.getItem(KEY)) || 0; } catch (e) { return 0; }
  });
  const scoreRef = useRef(0);

  const move = useCallback(() => {
    setActive(a => { let n; do { n = Math.floor(Math.random() * 9); } while (n === a); return n; });
  }, []);

  function start() {
    scoreRef.current = 0;
    setScore(0); setTime(30); setPhase("playing"); move();
  }

  useEffect(() => {
    if (phase !== "playing") return;
    const id = setInterval(() => setTime(t => t - 1), 1000);
    return () => clearInterval(id);
  }, [phase]);

  useEffect(() => {
    if (phase !== "playing") return;
    const delay = Math.max(350, 900 - scoreRef.current * 12);
    const id = setTimeout(move, delay);
    return () => clearTimeout(id);
  }, [active, phase, move]);

  useEffect(() => {
    if (phase === "playing" && time <= 0) {
      setPhase("over"); setActive(-1);
      if (scoreRef.current > best) {
        setBest(scoreRef.current);
        try { localStorage.setItem(KEY, String(scoreRef.current)); } catch (e) {}
      }
    }
  }, [time, phase, best]);

  function tap(i) {
    if (phase !== "playing") return;
    if (i === active) {
      scoreRef.current += 1; setScore(scoreRef.current); move();
    } else {
      scoreRef.current = Math.max(0, scoreRef.current - 1); setScore(scoreRef.current);
      setMiss(i); setTimeout(() => setMiss(-1), 200);
    }
  }

  const cells = [];
  for (let i = 0; i < 9; i++) {
    cells.push(h("button", {
      key: i, className: "cell" + (miss === i ? " miss" : ""),
      onClick: () => tap(i), "aria-label": i === active ? "Firefly" : "Empty"
    }, i === active ? h("span", { className: "fly" }) : null));
  }

  const message = phase === "idle" ? "Tap the glowing firefly. Missing costs a point."
    : phase === "over" ? "Time’s up. You caught " + score + "."
    : "Catch them before they drift off.";

  return h("div", null,
    h("h1", null, "Firefly Jar"),
    h("p", { className: "sub" }, "Thirty seconds. Fireflies get quicker as you catch more."),
    h("div", { className: "stats" },
      h("div", null, h("b", null, score), h("span", null, "Caught")),
      h("div", null, h("b", null, time > 0 ? time : 0), h("span", null, "Seconds left")),
      h("div", null, h("b", null, best), h("span", null, "Best"))),
    h("div", { className: "grid" }, cells),
    h("div", { className: "bar" },
      phase !== "playing" && h("button", { className: "go", onClick: start }, phase === "over" ? "Play again" : "Start"),
      h("span", { className: "msg" }, message)));
}

ReactDOM.createRoot(document.getElementById("root")).render(h(App));
</script>
</body>
</html>
