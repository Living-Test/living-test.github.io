<!DOCTYPE html>
<html lang="en" data-theme="atlas">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Team · Living Lab</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Manrope:wght@400;500;600;700&family=Newsreader:opsz,wght@6..72,450;6..72,600&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
  <script>
    (function () {
      var theme = localStorage.getItem("living-lab-theme");
      if (theme === "archive") theme = "atrium";
      if (theme !== "atrium" && theme !== "field") theme = "atlas";
      document.documentElement.dataset.theme = theme;
    })();
  </script>
  <style>
    :root {
      --bg: #0c1218;
      --ink: #e7eef6;
      --muted: #93a4b8;
      --card: #141c26;
      --line: #243140;
      --accent: #7eb6ff;
      --accent-ink: #071018;
      --font: "IBM Plex Sans", system-ui, sans-serif;
      --display: "IBM Plex Sans", system-ui, sans-serif;
      --mono: "IBM Plex Mono", ui-monospace, monospace;
      --radius: 2px;
      --shadow: none;
      color-scheme: dark;
    }
    [data-theme="atrium"] {
      --bg: #f3f6f4;
      --ink: #14211c;
      --muted: #4e645c;
      --card: #ffffff;
      --line: #d7e3dd;
      --accent: #0c7d62;
      --accent-ink: #ffffff;
      --font: "Source Sans 3", system-ui, sans-serif;
      --display: Newsreader, Georgia, serif;
      --mono: "IBM Plex Mono", ui-monospace, monospace;
      --radius: 16px;
      --shadow: 0 12px 32px rgba(20, 33, 28, 0.06);
      color-scheme: light;
    }
    [data-theme="field"] {
      --bg: #f4f7fb;
      --ink: #102033;
      --muted: #52657c;
      --card: #ffffff;
      --line: #d5e0ec;
      --accent: #0b5cab;
      --accent-ink: #ffffff;
      --font: Manrope, system-ui, sans-serif;
      --display: Manrope, system-ui, sans-serif;
      --mono: "IBM Plex Mono", ui-monospace, monospace;
      --radius: 12px;
      --shadow: 0 1px 0 rgba(16, 32, 51, 0.04);
      color-scheme: light;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: var(--font);
      color: var(--ink);
      background: var(--bg);
      line-height: 1.5;
    }
    [data-theme="atlas"] body {
      background:
        radial-gradient(520px circle at var(--mx, 70%) var(--my, 0%), rgba(126, 182, 255, 0.16), transparent 42%),
        linear-gradient(180deg, #101820 0%, var(--bg) 28rem);
    }
    .preview-bar {
      position: sticky;
      top: 0;
      z-index: 20;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
      flex-wrap: wrap;
      padding: 0.7rem 1.25rem;
      background: color-mix(in srgb, var(--bg) 88%, transparent);
      border-bottom: 1px solid var(--line);
      backdrop-filter: blur(10px);
    }
    .preview-label {
      margin: 0;
      font-family: var(--mono);
      font-size: 0.75rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
    }
    .theme-switch { display: flex; gap: 0.35rem; }
    .theme-switch button {
      font: inherit;
      font-size: 0.92rem;
      font-weight: 600;
      color: var(--ink);
      background: transparent;
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 0.35rem 0.8rem;
      cursor: pointer;
    }
    .theme-switch button[aria-checked="true"] {
      background: var(--accent);
      color: var(--accent-ink);
      border-color: var(--accent);
    }
    .wrap { max-width: 1080px; margin: 0 auto; padding: 3rem 1.25rem 4.5rem; }
    .site-nav { display: flex; gap: 1.1rem; margin: 0 0 1.5rem; }
    .site-nav a { color: var(--muted); font-weight: 600; text-decoration: none; }
    .site-nav a[aria-current="page"] { color: var(--ink); }
    header { margin-bottom: 2.5rem; max-width: 40rem; }
    .eyebrow {
      margin: 0 0 0.7rem;
      font-family: var(--mono);
      font-size: 0.75rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--accent);
    }
    h1 {
      margin: 0;
      font-family: var(--display);
      font-weight: 560;
      font-size: clamp(3rem, 7vw, 4.6rem);
      letter-spacing: -0.045em;
      line-height: 0.95;
    }
    [data-theme="atrium"] h1 { font-weight: 500; letter-spacing: -0.03em; }
    .subtitle { margin: 0.9rem 0 0; font-size: 1.15rem; color: var(--muted); }
    .bench-count { margin: 1.2rem 0 0; color: var(--muted); font-family: var(--mono); font-size: 0.82rem; }
    .people {
      display: flex;
      flex-wrap: wrap;
      gap: 0.9rem;
      margin-top: 1.5rem;
    }
    .person {
      display: grid;
      grid-template-columns: 4.5rem 1fr;
      gap: 0.95rem;
      align-items: center;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 1rem;
      box-shadow: var(--shadow);
      color: inherit;
      text-decoration: none;
      flex: 1 1 280px;
      max-width: 420px;
    }
    a.person { cursor: pointer; }
    [data-theme="atlas"] a.person:hover { border-color: var(--accent); }
    .portrait, .initials {
      width: 4.5rem;
      height: 4.5rem;
      border-radius: 50%;
    }
    .portrait { object-fit: cover; background: var(--line); }
    .initials {
      display: grid;
      place-items: center;
      background: color-mix(in srgb, var(--accent) 18%, var(--card));
      color: var(--accent);
      font-family: var(--display);
      font-weight: 600;
    }
    .person h2 {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      margin: 0;
      font-family: var(--display);
      font-size: 1.25rem;
      font-weight: 600;
      letter-spacing: -0.02em;
    }
    .role, .focus { margin: 0.15rem 0 0; color: var(--muted); }
    .new-tab { width: 0.85em; height: 0.85em; flex: none; color: var(--muted); }
    .empty { margin: 1.5rem 0 0; color: var(--muted); }
    .visually-hidden {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
    @media (max-width: 720px) {
      .wrap { padding-top: 2rem; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; }
      [data-theme="atlas"] body { background: var(--bg); }
    }
  </style>
</head>
<body>
  <div class="preview-bar">
    <p class="preview-label">Compare designs</p>
    <div class="theme-switch" role="radiogroup" aria-label="Site design">
      <button type="button" role="radio" data-choice="atlas" aria-checked="false">Atlas</button>
      <button type="button" role="radio" data-choice="atrium" aria-checked="false">Atrium</button>
      <button type="button" role="radio" data-choice="field" aria-checked="false">Field</button>
    </div>
  </div>

  <div class="wrap">
    <nav class="site-nav" aria-label="Site">
      <a href="/">Projects</a>
      <a href="/team/" aria-current="page">Team</a>
    </nav>
    <header>
      <p class="eyebrow">Research lab</p>
      <h1>Team</h1>
      <p class="subtitle">People in the lab.</p>
      <p class="bench-count" id="team-count" aria-live="polite"></p>
    </header>
    <main>
      <div class="people" id="people"></div>
      <p class="empty" id="team-empty" hidden>No team members yet. Add them in Pages CMS.</p>
    </main>
  </div>

  <script>
    const THEME_KEY = "living-lab-theme";
    const list = document.querySelector("#people");
    const count = document.querySelector("#team-count");
    const empty = document.querySelector("#team-empty");

    function applyTheme(name) {
      const theme = name === "atrium" || name === "archive" || name === "field" ? (name === "archive" ? "atrium" : name) : "atlas";
      document.documentElement.dataset.theme = theme;
      localStorage.setItem(THEME_KEY, theme);
      document.querySelectorAll(".theme-switch button").forEach((button) => {
        button.setAttribute("aria-checked", button.dataset.choice === theme ? "true" : "false");
      });
    }

    document.querySelectorAll(".theme-switch button").forEach((button) => {
      button.addEventListener("click", () => applyTheme(button.dataset.choice));
    });
    applyTheme(document.documentElement.dataset.theme);

    if (!window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
      document.addEventListener("pointermove", (event) => {
        if (document.documentElement.dataset.theme !== "atlas") return;
        if (event.pointerType && event.pointerType !== "mouse") return;
        document.documentElement.style.setProperty("--mx", `${event.clientX}px`);
        document.documentElement.style.setProperty("--my", `${event.clientY}px`);
      });
    }

    function assetUrl(value) {
      if (!value) return "";
      const splitAt = value.search(/[?#]/);
      const filePath = splitAt === -1 ? value : value.slice(0, splitAt);
      const suffix = splitAt === -1 ? "" : value.slice(splitAt);
      return filePath.split("/").map((part, index) => (index === 0 ? part : encodeURIComponent(part))).join("/") + suffix;
    }

    function photoPath(photo) {
      if (!photo) return "";
      if (typeof photo === "string") return photo;
      if (typeof photo === "object") return photo.src || photo.path || photo.url || "";
      return "";
    }

    function contact(value) {
      const text = (value || "").trim();
      if (!text) return null;
      if (/^https?:\/\//i.test(text)) return { href: text, external: true };
      if (/^mailto:/i.test(text)) return { href: text, external: false };
      if (text.includes("@")) return { href: `mailto:${text}`, external: false };
      return null;
    }

    function initials(name) {
      return name.split(/\s+/).filter(Boolean).slice(0, 2).map((part) => part[0]).join("").toUpperCase();
    }

    function render(members) {
      list.replaceChildren();
      const people = members
        .filter((person) => person && person.name)
        .sort((a, b) => a.name.localeCompare(b.name));
      count.textContent = people.length === 1 ? "1 person" : `${people.length} people`;
      empty.hidden = people.length > 0;
      for (const person of people) {
        const link = contact(person.link);
        const card = document.createElement(link ? "a" : "article");
        card.className = "person";
        if (link) {
          card.href = link.href;
          if (link.external) {
            card.target = "_blank";
            card.rel = "noopener noreferrer";
          }
        }

        const photo = photoPath(person.photo);
        if (photo) {
          const image = document.createElement("img");
          image.className = "portrait";
          image.src = assetUrl(photo);
          image.alt = "";
          card.append(image);
        } else {
          const mark = document.createElement("div");
          mark.className = "initials";
          mark.setAttribute("aria-hidden", "true");
          mark.textContent = initials(person.name);
          card.append(mark);
        }

        const body = document.createElement("div");
        const name = document.createElement("h2");
        name.textContent = person.name;
        if (link && link.external) {
          const icon = document.createElementNS("http://www.w3.org/2000/svg", "svg");
          icon.setAttribute("class", "new-tab");
          icon.setAttribute("viewBox", "0 0 24 24");
          icon.setAttribute("aria-hidden", "true");
          icon.innerHTML = '<path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M15 3h6v6"/><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M10 14 21 3"/>';
          name.append(icon);
          const hint = document.createElement("span");
          hint.className = "visually-hidden";
          hint.textContent = "Opens in a new tab";
          name.append(hint);
        }
        body.append(name);
        if (person.role) {
          const role = document.createElement("p");
          role.className = "role";
          role.textContent = person.role;
          body.append(role);
        }
        if (person.focus) {
          const focus = document.createElement("p");
          focus.className = "focus";
          focus.textContent = person.focus;
          body.append(focus);
        }
        card.append(body);
        list.append(card);
      }
    }

    fetch("/team.json", { cache: "no-store" })
      .then((response) => response.ok ? response.json() : [])
      .then((data) => render(Array.isArray(data) ? data : []))
      .catch(() => render([]));
  </script>
</body>
</html>
